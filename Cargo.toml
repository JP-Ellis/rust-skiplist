#:schema https://json.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "skiplist"
version = "1.3.4"
description = "Skiplist implementation in Rust for fast insertion and removal, including a normal skiplist, ordered skiplist, and skipmap."

documentation = "https://docs.rs/skiplist"
repository = "https://github.com/JP-Ellis/rust-skiplist"
license = "MIT"
keywords = ["collection", "skiplist", "sorted"]
categories = ["data-structures"]

edition = "2024"
rust-version = "1.98"

  [package.metadata]
    [package.metadata.docs.rs]
    features = ["partial-ord", "docs", "cursor"]
    rustdoc-args = [
      "--html-in-header",
      ".cargo/katex.header.html",
      "--html-after-content",
      ".cargo/katex.script.html",
      "--html-in-header",
      ".cargo/mermaid.header.html",
      "--html-after-content",
      ".cargo/mermaid.script.html",
    ]

[[example]]
name = "custom_ordering"
required-features = ["std"]

[[example]]
name = "float_keys"
required-features = ["std"]

[[example]]
name = "getting_started"
required-features = ["std"]

[[example]]
name = "leaderboard"
required-features = ["std"]

[[bench]]
harness = false
name = "skip_list"
required-features = ["std"]

[[bench]]
harness = false
name = "ordered_skip_list"
required-features = ["std"]

[[bench]]
harness = false
name = "skip_set"
required-features = ["std"]

[[bench]]
harness = false
name = "skip_map"
required-features = ["std"]

[[bench]]
harness = false
name = "level_generator"
required-features = ["std"]

[dependencies]
rand = { version = "0.10", default-features = false }

[dev-dependencies]
anyhow = "=1.0.104"
criterion = { version = "=0.8.2", features = ["html_reports"] }
insta = "=1.49.0"
pretty_assertions = { version = "=1.4.1", features = ["unstable"] }
rstest = "=0.28.0"

[badges]
codecov = { branch = "main", repository = "JP-Ellis/rust-skiplist", service = "github" }

[features]
default = ["std"]
## Enable the gap-cursor API (`lower_bound`, `upper_bound`, `CursorMut`, etc.)
## for [`OrderedSkipList`], [`SkipSet`], and [`SkipMap`].
##
## **This feature is unstable.** The cursor API may change in a future minor
## release without prior notice.
cursor = []
## Enable the `docs` module, which provides long-form explanation pages for
## skip list concepts, internals, and the `partial-ord` feature.
docs = []
## Seed generators directly from the operating system entropy source without
## the standard library. Enables `Geometric::new` and the collection
## constructors that call it. `std` takes precedence when both are enabled.
getrandom = ["rand/sys_rng"]
## Enable `PartialOrdComparator`, which uses `PartialOrd` and panics when
## elements are incomparable (i.e. `partial_cmp` returns `None`).
partial-ord = []
## Link the standard library and seed generators from the thread-local RNG.
## Enables `Geometric::new` and the collection constructors that call it.
std = ["rand/thread_rng"]

[lints]
  [lints.clippy]
  # I prefer enabling all lints and then silencing the ones I don't care about
  cargo = { level = "warn", priority = -1 }
  complexity = { level = "warn", priority = -1 }
  correctness = { level = "warn", priority = -1 }
  pedantic = { level = "warn", priority = -1 }
  perf = { level = "warn", priority = -1 }
  restriction = { level = "warn", priority = -1 }
  style = { level = "warn", priority = -1 }
  suspicious = { level = "warn", priority = -1 }

  arbitrary_source_item_ordering = "allow"
  blanket_clippy_restriction_lints = "allow"
  default_numeric_fallback = "allow"
  else_if_without_else = "allow"
  impl_trait_in_params = "allow"
  implicit_return = "allow"
  min_ident_chars = "allow"
  missing_trait_methods = "allow"
  non_ascii_literal = "allow"
  panic_in_result_fn = "allow"  # https://github.com/rust-lang/rust-clippy/issues/14056
  pattern_type_mismatch = "allow"
  pub_with_shorthand = "allow"
  question_mark_used = "allow"
  ref_patterns = "allow"
  rest_pattern_accessible_field = "allow"  # contradicts unneeded_field_pattern; `{ .. }` is the house style
  self_named_module_files = "allow"
  separated_literal_suffix = "allow"
  similar_names = "allow"
  single_call_fn = "allow"
  single_char_lifetime_names = "allow"
  std_instead_of_alloc = "allow"
  std_instead_of_core = "allow"
  string_add = "allow"
  unreachable = "allow"
  unused_trait_names = "allow"

  [lints.rust]
  future_incompatible = "warn"
  missing_docs = "warn"
  warnings = "warn"

  [lints.rustdoc]
  missing_crate_level_docs = "warn"
