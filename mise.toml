#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true

[vars]
# Feature sets for every cargo-hack run. `default` only enables `std`, so it is
# excluded. `cursor`, `docs` and `partial-ord` are additive and independent, so
# they are tested together, either all on or all off.
powerset = "--feature-powerset --exclude-features default --group-features cursor,docs,partial-ord"

[env]
# rustdoc requires absolute paths for these flags; {{config_root}} expands to
# the repository root, so this works both locally and in CI.
RUSTDOCFLAGS = "--html-in-header {{config_root}}/.cargo/katex.header.html --html-after-content {{config_root}}/.cargo/katex.script.html --html-in-header {{config_root}}/.cargo/mermaid.header.html --html-after-content {{config_root}}/.cargo/mermaid.script.html"

# Replicates the rust-analyzer build environment to avoid rebuilding
# dependencies. See rust-lang/rust-analyzer#17149.
RUSTC_BOOTSTRAP = "1"

# Fail every cargo invocation on warnings (rustc lints and cargo manifest
# lints). Applies to all tasks, so `mise run ci` matches CI.
CARGO_BUILD_WARNINGS = "deny"

[tools]
"core:rust" = { version = "1.99", components = "clippy,llvm-tools" }
"aqua:cargo-bins/cargo-binstall" = "1.26.0"
"github:taiki-e/cargo-hack" = "0.6"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9"
"aqua:j178/prek" = "0.5"
rumdl = "v0.3.0"

[tasks]
  [tasks.lint]
  description = "Lint with Clippy across all feature combinations"
  # The library builds in every feature set. Tests, benches and examples need
  # `std` or `getrandom` to construct generators, so only those sets lint them.
  run = [
    "cargo hack {{vars.powerset}} clippy --lib",
    "cargo hack {{vars.powerset}} --at-least-one-of std,getrandom clippy --all-targets",
  ]

  [tasks.format]
  description = "Check or apply formatting (nightly rustfmt + rumdl)"
  usage = 'flag "--fix" help="Apply changes rather than checking"'
  run = [
    "cargo +nightly fmt {% if not usage.fix %}--check{% endif %}",
    "rumdl check {% if usage.fix %}--fix{% endif %} .",
  ]

  [tasks.test]
  description = "Run unit tests across all feature combinations"
  run = "cargo hack {{vars.powerset}} --at-least-one-of std,getrandom nextest run"

  [tasks."test:docs"]
  description = "Run documentation tests"
  run = "cargo test --doc --features docs"

  [tasks."test:benches"]
  description = "Compile and smoke-test benchmarks"
  run = "cargo test --benches '/'"

  [tasks.examples]
  description = "Run all examples"
  run = [
    "cargo run --example getting_started",
    "cargo run --example custom_ordering",
    "cargo run --example float_keys",
    "cargo run --example leaderboard",
  ]

  [tasks.miri]
  description = "Run Miri under Tree Borrows, one shard per data structure"
  # Miri runs each test binary single-threaded, so the shards run in parallel
  # up to `--jobs`.
  depends = [
    "miri:skip-list",
    "miri:ordered-skip-list",
    "miri:skip-set",
    "miri:skip-map",
    "miri:rest",
  ]

  [tasks."miri:build"]
  description = "Set up the Miri sysroot and build the test binaries"
  # Miri's generated sysroot crate carries an unused `sysroot` dependency, so
  # cargo's `unused_dependencies` manifest lint fails the build under
  # `build.warnings = "deny"`. Build the sysroot with warnings allowed; the
  # build that follows still denies warnings for this crate.
  run = [
    "CARGO_BUILD_WARNINGS=allow cargo +nightly miri setup",
    "cargo +nightly miri test --all-features --no-run",
  ]

  # libtest filters match substrings, so `skip_list::` also matches
  # `ordered_skip_list::` and needs an explicit skip.
  [tasks."miri:skip-list"]
  description = "Run Miri on the SkipList tests"
  depends = ["miri:build"]
  run = "cargo +nightly miri test --all-features --lib -- skip_list:: --skip ordered_skip_list::"

  [tasks."miri:ordered-skip-list"]
  description = "Run Miri on the OrderedSkipList tests"
  depends = ["miri:build"]
  run = "cargo +nightly miri test --all-features --lib -- ordered_skip_list::"

  [tasks."miri:skip-set"]
  description = "Run Miri on the SkipSet tests"
  depends = ["miri:build"]
  run = "cargo +nightly miri test --all-features --lib -- skip_set::"

  [tasks."miri:skip-map"]
  description = "Run Miri on the SkipMap tests"
  depends = ["miri:build"]
  run = "cargo +nightly miri test --all-features --lib -- skip_map::"

  [tasks."miri:rest"]
  description = "Run Miri on the remaining tests and the doctests"
  depends = ["miri:build"]
  # Doctest names include their module path, so the skips above would drop
  # most doctests. They run in a separate invocation.
  run = [
    "cargo +nightly miri test --all-features --tests -- --skip skip_list:: --skip ordered_skip_list:: --skip skip_set:: --skip skip_map::",
    "cargo +nightly miri test --all-features --doc",
  ]

  [tasks.coverage]
  description = "Generate LCOV coverage report"
  run = "cargo llvm-cov nextest --all-features --lcov --output-path coverage.lcov"

  [tasks.msrv]
  description = "Verify the declared MSRV compiles the library"
  run = "cargo +1.98 hack {{vars.powerset}} check"

  [tasks."no-std"]
  description = "Build the library for no_std targets and test it without entropy"
  run = [
    "cargo build --lib --no-default-features --target thumbv6m-none-eabi",
    "cargo build --lib --no-default-features --features cursor,partial-ord,docs --target thumbv6m-none-eabi",
    "cargo build --lib --no-default-features --target wasm32-unknown-unknown",
    "cargo nextest run --no-default-features --test no_entropy",
  ]

  [tasks.prek]
  description = "Run prek hooks (Rust hooks skipped; they have dedicated jobs)"
  env = { SKIP = "cargo-check,cargo-clippy,cargo-fmt" }
  run = "prek run --all-files"

  [tasks.ci]
  description = "Run the full CI suite locally"
  run = [
    { task = "format" },
    { task = "prek" },
    { task = "lint" },
    { task = "test" },
    { task = "test:docs" },
    { task = "test:benches" },
    { task = "examples" },
    { task = "msrv" },
    { task = "miri" },
  ]
